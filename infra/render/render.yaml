# Render Blueprint — STAGING ONLY (DEC-073, docs/INFRASTRUCTURE_DECISION.md).
#
# Apply in the STAGING Render workspace (Pro plan). Production gets its own
# workspace in a later phase and is NOT described here: staging and production
# share no database, secret, private network or deploy hook.
#
# Secrets are never in this file, and almost none are handled by a person
# (DEC-081): Render GENERATES the session/OTP/media secrets, the API's database
# password and both internal key secrets; the release step turns the database
# password into the API's own login. The few `sync: false` values (bucket names,
# role ARN, Netgsm sub-user, the service URL) are entered once in the Dashboard
# (Render prompts on the first Blueprint sync and ignores them afterwards — add
# new ones by hand). Two secrets are copied by a person, each once, never into
# chat: INTERNAL_KEY_RUNNER_SECRET, from this service's Environment page into the
# GitHub Environment "staging" as STAGING_KEY_SECRET; and INTERNAL_KEY_REVIEWER_SECRET,
# typed into the owner's review tool on their own computer (DEC-087). Field reference: https://render.com/docs/blueprint-spec
# (checked 2026-10-07).
#
# The API is reached at its onrender.com address (it contains "staging", which the
# staging tools require). A custom domain is optional: add `domains:` later.
projects:
  - name: velvet
    environments:
      - name: staging
        networking:
          isolation: enabled        # block private-network traffic into/out of this environment (Pro)
        permissions:
          protection: enabled       # destructive actions need an admin
        envVarGroups:
          # Shared by the API (which verifies the ops key) and the cron (which signs with it): one generated value.
          - name: velvet-staging-ops
            envVars:
              - key: INTERNAL_KEY_OPS_SECRET
                generateValue: true
        services:
          - type: web
            name: velvet-api-staging
            runtime: docker
            region: frankfurt
            plan: 0.5c-512mb        # measure image processing under load; 1c-2g if memory is tight
            dockerfilePath: ./server/Dockerfile
            dockerContext: .
            # The release step: runs on a separate instance after the build and BEFORE the new
            # version takes traffic; a failure fails the deploy and the old version keeps serving.
            preDeployCommand: node dist/migrate.mjs
            # Render probes this path on every running instance and RESTARTS one that keeps failing
            # (https://render.com/docs/health-checks). /health/ready would fail during a database or
            # storage outage — restarting cannot fix those — so Render probes liveness. A new instance
            # still proves its readiness before it serves: the API refuses to start unless its database
            # role, the schema and the migration ledger check out (main.ts), and CI checks /health/ready.
            healthCheckPath: /health/live
            autoDeployTrigger: off  # CI deploys (deploy hook) only after every check passed
            envVars:
              - fromGroup: velvet-staging-ops
              - key: APP_ENV
                value: staging
              - key: NODE_ENV
                value: production
              - key: HOST
                value: 0.0.0.0
              - key: PORT
                value: "10000"
              - key: LOG_LEVEL
                value: info
              - key: TRUST_PROXY_HOPS
                value: "1"
              - key: PUBLIC_BASE_URL
                sync: false         # this service's https://…onrender.com address (shown on the service page)
              - key: CORS_ORIGINS
                sync: false         # the staging web app's https://velvet-web-staging….onrender.com address (DEC-086)
              # --- Database: the owner for the release step, the runtime login for the API (DEC-074, DEC-081)
              - key: MIGRATION_DATABASE_URL
                fromDatabase:
                  name: velvet-db-staging
                  property: connectionString   # internal (private network) URL of the default user
              - key: DATABASE_RUNTIME_USER
                value: velvet_api   # created/re-asserted by the release step, group velvet_runtime only
              - key: DATABASE_RUNTIME_PASSWORD
                generateValue: true # nobody sees it: the release step stores a SCRAM verifier; the API derives its URL
              - key: DATABASE_TLS
                value: require      # Render's internal endpoint uses a self-signed certificate (verify-full impossible)
              - key: DATABASE_POOL_MAX
                value: "10"
              # --- Secrets generated by Render (base64, 256-bit)
              - key: OTP_SECRET
                generateValue: true
              - key: MEDIA_SIGNING_SECRET
                generateValue: true
              # The key LIST is configuration; each secret is its own generated variable.
              - key: INTERNAL_KEYS_JSON
                value: '{"runner":{"secretEnv":"INTERNAL_KEY_RUNNER_SECRET","scopes":["test:otp","test:review"]},"ops":{"secretEnv":"INTERNAL_KEY_OPS_SECRET","scopes":["retention:run","media:reconcile"]},"reviewer":{"secretEnv":"INTERNAL_KEY_REVIEWER_SECRET","scopes":["review:read","review:write","review:media","membership:complimentary"]}}'
              - key: INTERNAL_KEY_RUNNER_SECRET
                generateValue: true # copy ONCE into GitHub Environment "staging" → STAGING_KEY_SECRET (never into chat)
              - key: INTERNAL_KEY_REVIEWER_SECRET
                generateValue: true # the membership team's key (DEC-087): typed ONCE into `velvet-review kur` on the owner's computer (never into chat)
              # - key: INTERNAL_ALLOWED_CIDRS   # optional, see docs/INFRASTRUCTURE_DECISION.md §1.1 — would also shut out the owner's review tool
              # --- SMS (Netgsm OTP, staging API sub-user)
              - key: SMS_PROVIDER
                sync: false         # "none" until the SMS account and sender name exist; then "iletimerkezi" (DEC-085) — or "netgsm" with a company account. Test numbers work either way.
              # --- İleti Merkezi (individual account; panel → Ayarlar → API)
              - key: ILETIMERKEZI_API_KEY
                sync: false
              - key: ILETIMERKEZI_API_HASH
                sync: false         # a credential (derived by the panel from the API key and secret)
              - key: ILETIMERKEZI_SENDER
                sync: false         # the approved sender name, ≤ 11 characters
              # --- Netgsm (company accounts only; kept for later)
              - key: NETGSM_USERCODE
                sync: false
              - key: NETGSM_PASSWORD
                sync: false         # the password of the STAGING "API Kullanıcısı" sub-user
              - key: NETGSM_HEADER
                sync: false
              - key: SMS_TEST_NUMBERS
                value: "+90555000*" # designated test numbers → internal outbox, never a phone; refused in production
              - key: SMS_QA_REAL_NUMBERS
                sync: false         # the project SIMs (comma-separated +905…): real SMS, but QA accounts (DEC-083); refused in production
              # --- Storage (AWS S3 Frankfurt, workload identity — infra/aws/README.md)
              - key: STORAGE_DRIVER
                value: s3
              - key: S3_REGION
                value: eu-central-1
              - key: S3_BUCKET
                sync: false
              - key: S3_VERIFICATION_BUCKET
                sync: false
              - key: AWS_ROLE_ARN
                sync: false         # Render then sets AWS_WEB_IDENTITY_TOKEN_FILE itself
              - key: AWS_REGION
                value: eu-central-1
              # --- Product
              - key: APP_TIME_ZONE
                value: Europe/Istanbul
              # RETENTION_* stay UNSET until the retention policy is decided (docs/DATA_RETENTION.md).

          # The staging WEB app (DEC-086): the same app, built for the staging channel, served from Render's CDN.
          # Invited testers open the link in Safari and "Add to Home Screen". The build fails unless the bundle
          # passes the staging release gate (staging API host, staging channel, no dev hooks or fixtures).
          - type: web
            name: velvet-web-staging
            runtime: static
            buildCommand: npm ci && npx expo export -p web --clear --output-dir dist-staging && node scripts/check-release-bundle.mjs dist-staging --channel staging
            staticPublishPath: ./dist-staging
            autoDeployTrigger: checksPass  # only after CI on main is green
            routes:
              - type: rewrite              # single-page app: every path is the app
                source: /*
                destination: /index.html
            headers:
              - path: /*
                name: X-Frame-Options
                value: DENY
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: Referrer-Policy
                value: no-referrer
              - path: /*
                name: X-Robots-Tag
                value: noindex, nofollow
              - path: /*
                name: Permissions-Policy
                value: geolocation=(), microphone=(), camera=(self)
            envVars:
              - key: APP_VARIANT
                value: staging             # "Velvet Staging" — never mistaken for production (DEC-078)
              - key: EXPO_PUBLIC_APP_ENV
                value: production
              - key: EXPO_PUBLIC_RELEASE_CHANNEL
                value: staging
              - key: EXPO_PUBLIC_API_URL
                sync: false                # the API's https://…onrender.com address (not a secret)
              - key: NODE_VERSION
                value: "22"

          # Scheduled operations: retention (housekeeping + deletion queue) every hour, as a signed internal call.
          - type: cron
            name: velvet-ops-staging
            runtime: docker
            region: frankfurt
            plan: 0.5c-512mb
            dockerfilePath: ./server/Dockerfile
            dockerContext: .
            schedule: "17 * * * *"
            dockerCommand: node dist/ops.mjs retention
            envVars:
              - fromGroup: velvet-staging-ops   # INTERNAL_KEY_OPS_SECRET (scripts/ops.ts reads it)
              - key: OPS_API_URL
                sync: false         # the API's https://…onrender.com address
              - key: OPS_ENVIRONMENT
                value: staging
              - key: OPS_KEY_ID
                value: ops

        databases:
          - name: velvet-db-staging
            region: frankfurt
            plan: 0.5c-1g
            postgresMajorVersion: "16"   # the version every test and rehearsal runs on; cannot change later
            databaseName: velvet
            ipAllowList: []              # no external access at all: only services on the private network
